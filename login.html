<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Document</title>
    <style>
        .hh {
            background-image: url(./imags/tn.avif);
            background-repeat: no-repeat;
            background-size: cover;
            
        }

        .email {
            height: 40px;
            width: 300px;
            border: 3px solid white;
            border-bottom: 3px solid black;
        }

        .password {
            height: 40px;
            width: 300px;
            border: 3px solid white;
            border-bottom: 3px solid black;
        }

        .button {
            height: 50px;
            width: 150px;
            background-color: black;
            border: 2px solid white;
            border-radius: 10px;

        }

        .p {
            display: inline;
            font-size: 14px;

        }

        .checkbox {
            padding-left: 200px;

        }

        .a {
            /* display: inline; */
            font-size: 14px;
            padding-left: 80px;
        }

        .c {
            padding-left: 200px;
        }

        .o{
            padding-left: 200px;
        }
        .g{
            padding-left: 270px;
        }
       
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-6 py-5 hh"></div>
            <div class="col-12 col-sm-6 py-5">
                <div class=" row">
                    <div class=" py-5 col-12 ">
                        <h1 style="font-weight: bold;" class="text-center">welcome</h1>
                    </div>
                    <div class=" py-5 col-12 c">
                        <form>
                            <input type="email" placeholder="email" class="email">
                        </form>
                    </div>
                    <div class=" py-5 col-12 o">
                        <form>
                            <input type="password" placeholder="password" class="password ">
                        </form>
                    </div>
                    <div class="py-5 col-12 checkbox">
                        <form>
                            <input type="checkbox" class="">
                            <p class="p">remember me</p>
                            <a href="google.com" class="a">forgot password</a>
                        </form>
                    </div>
                    <div class="  py-5 col-12 g">
                        <form>
                            <button class="button bg-dark text-light">login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
