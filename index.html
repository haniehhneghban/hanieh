<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Document</title>
    <style>
        .a {
            border-radius: 0 50% 0 50%;
            background-color: green;
            height: 100vh;
            /* width: 50vw; */
        }

        .icon {
            background-color: white;
            border: 10px solid white;
            border-radius: 50%;
            position: relative;

        }

        .button {
            border: 1px solid white;
            background-color: green;
            height: 40px;
            width: 400px;
            border-radius: 50px;
        }


        .form {

        }

        .card {
            height: 100vh;
            border-radius: 0 50% 0 0;
            border: 0px solid white;
        }

        /* .welcom {
            font-size: 55px;
        } */

        .email {
            height: 50px;
            width: 500px;
            border-radius: 50px;
            border: 0px solid white;
            background-color: rgba(35, 184, 35, 0.514);
        }

        .password {
            height: 50px;
            width: 500px;
            border-radius: 50px;
            border: 0px solid white;
            background-color: rgba(35, 184, 35, 0.514);
        }

        .email::placeholder {
            text-align: center;
        }

        .password {
            text-align: center;
        }

        .login {
            background-color: green;
            height: 40px;
            width: 200px;
            border-radius: 50px;
            border: 0px solid white;

        }
        @media {
            .a{
                border-radius: 0 0 0 0 ;
            }
        }
    </style>
</head>
